# Khai báo Spark chạy trên trình quản lý tài nguyên YARN của Hadoop
spark.master                     yarn
spark.submit.deployMode          client
spark.driver.memory              1g
spark.executor.memory            1g
spark.executor.cores             1

# Ghi lại lịch sử thực thi các tác vụ Spark lên HDFS
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://toan-master:9000/spark-logs
spark.history.fs.logDirectory    hdfs://toan-master:9000/spark-logs
spark.yarn.historyServer.address toan-master:18080
